services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-chess_dev_password}"
      POSTGRES_DB: chess
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chess-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://chess:${POSTGRES_PASSWORD:-chess_dev_password}@db:5432/chess?sslmode=disable}"
      HTTP_ADDR: ":8080"
      WEB_DIR: /app/web/dist
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:8080}"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  chess-postgres:
