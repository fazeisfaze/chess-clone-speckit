services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_dev_password}
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - chess-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  chess-postgres:
